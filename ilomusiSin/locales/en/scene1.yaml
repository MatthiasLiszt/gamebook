sec_0001_img_desc: You come to the sea town of Palaki. Flags are black. jan Mawa gives
  greetings, but he kills jan pana with a small knife. Many black soldiers of jan
  Sanasin stand around you in a bad trap.
sec_0001_maouk_greeting: A thousand greetings, jan Lansi Opa. I am jan Mawa. I say
  welcome to our town for my ruler, the great jan Saman Kima.
sec_0001_envoy_warning: This is a bad trap! You must...
sec_0001_choice_fight: Fight against these many men
sec_0001_choice_surrender: Give up to jan Mawa and his men
sec_0001_choice_flee: Run back to the ship
