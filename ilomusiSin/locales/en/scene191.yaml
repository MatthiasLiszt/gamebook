# Basic English Narrative & Dialogue
sec_0191_img_desc: "You move along the oars to the ship edge. Hands take your coat and help you onto the ship. Across the water, jan Mawa talks loud and makes a bad threat to kill all family of the ship men."

sec_0191_maouk_demand: "Give the jan Lansi Opa to me. jan Saman commands it. All your family will die if you do not do this!"

# Simplified Choices
sec_0191_choice_surrender: "Give up to jan Mawa"
sec_0191_choice_dive_water: "Jump into the water to run away"