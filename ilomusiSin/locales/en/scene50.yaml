# Basic English Narrative & Dialogue
sec_0050_img_desc: "Your boots slip on wet wood. You fall, hit your head, and lose 2 ENDURANCE points. The jan Sanasin pull you out of the water by your coat and drag you across the stones to jan Mawa."

sec_0050_maouk_taunt: "You have much heart, jan Lansi Opa. But heart will not keep you safe now."

